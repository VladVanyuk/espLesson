[upesy_wroom_env]
platform = espressif32
board =   esp32-s3-devkitm-1 ;upesy_wroom
board_build.mcu = esp32s3
framework = arduino
lib_deps = Wire



; [debug_build]
; build_type = debug
; build_flags = 
;             -D DEBUG 
;             -D UART_SPD=115200



[env:s3_debug]
extends = upesy_wroom_env
build_type = debug 
; framework = esp-idf
build_flags = -DESP_IDF_CONFIG=0
monitor_speed = 115200
; debug_tool = esp-builtin
; debug_port = COM16
; debug_speed = 


[env:s3_release]
extends = upesy_wroom_env
build_type = release 
build_flags = -DESP_IDF_CONFIG=0

