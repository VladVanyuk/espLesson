; https://docs.platformio.org/page/projectconf.html

; [platformio]
; default_envs = s3_release


[upesy_wroom_env]
platform = espressif32
board = upesy_wroom
board_build.mcu = esp32s3
framework = arduino
lib_deps = Wire



; [debug_build]
; build_type = debug
; build_flags = 
;             -D DEBUG 
;             -D UART_SPD=115200



[env:s3_debug]
extends = upesy_wroom_env
build_type = debug 
; framework = esp-idf
build_flags = -D ESP_IDF_CONFIG=0



[env:s3_release]
extends = upesy_wroom_env
build_type = release 
build_flags = -D ESP_IDF_CONFIG=0

